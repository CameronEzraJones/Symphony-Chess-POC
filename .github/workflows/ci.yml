name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [build, lint, unit, integration, e2e]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.check == 'build'
        run: npm run build
      - if: matrix.check == 'lint'
        run: npm run lint
      - if: matrix.check == 'unit'
        run: npm run test:unit
      - if: matrix.check == 'integration'
        run: npm run test:integration
      - if: matrix.check == 'e2e'
        run: |
          npx playwright install --with-deps chromium
          npm run build
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: matrix.check == 'e2e' && !cancelled()
        with:
          name: chessboard-screenshots
          path: docs/screenshots/*.png
  coverage-report:
    name: Measure coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { total } = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const head_sha = context.payload.pull_request?.head.sha || context.sha;
            await github.rest.checks.create({
              ...context.repo,
              name: 'coverage',
              head_sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Application coverage',
                summary: `<!-- symphony-coverage ${JSON.stringify({ head_sha, total })} -->`
              }
            });
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/coverage-summary.json
